[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-hallucination-benchmark"
version = "0.1.0"
description = "Reproducible 8-frame VideoLLM hallucination benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
models = ["torch>=2.1", "transformers>=4.49", "accelerate>=0.27", "Pillow>=10"]
dino = ["torchvision>=0.16"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
