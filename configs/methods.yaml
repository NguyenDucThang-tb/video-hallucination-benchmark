methods:
  base:
    batch_size: 1
  tcd:
    batch_size: 1
    alpha: 0.5
    beta: 0.5
    downsample_frames: 4
    threshold_space: raw_logits
    all_masked_behavior: original_argmax
  dino_heal:
    batch_size: 1
    dino_checkpoint: facebook/dinov2-large
    dino_device: cpu
    visual_weight: 0.3
    saliency_weight: 0.7
    require_dino: true
  season:
    batch_size: 1
    alpha: 1.0
    homogenization_beta: 0.33
    spatial_noise_std: 0.1
    attention_layers: [20, 21, 22, 23]
    expected_frame_count: 8
    epsilon: 1.0e-8
